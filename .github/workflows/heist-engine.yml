name: Heist Engine

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

concurrency:
  group: heist-engine
  cancel-in-progress: false

jobs:
  heist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Verify build
        run: test -f dist/index.js

      - run: node dist/index.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVENT_SPAM: 'true'
          HEIST_TURN_INTERVAL_MS: '60000'
          HEIST_COMMENT_INTERVAL_MS: '5000'
